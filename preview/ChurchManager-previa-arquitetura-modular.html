<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><title>ChurchManager — Prévia da arquitetura modular</title><style>
:root{--blue:#2563eb;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc;--white:#fff;--green:#15803d;--red:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100dvh}.top{height:64px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.logo{width:36px;height:36px;border-radius:11px;background:var(--blue);color:white;display:grid;place-items:center;font-weight:800}.top small{display:block;color:var(--muted);font-weight:500}.layout{display:flex;max-width:1440px;margin:auto}.side{width:230px;padding:20px 12px;background:white;border-right:1px solid var(--line);min-height:calc(100dvh - 64px);flex-shrink:0}.navlabel{font-size:11px;color:#94a3b8;font-weight:800;letter-spacing:.1em;padding:10px 12px}.nav{width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:10px;color:#475569;display:flex;gap:11px;align-items:center;margin:2px 0}.nav.active,.nav:hover{background:#eff6ff;color:var(--blue);font-weight:700}.main{min-width:0;flex:1;padding:26px;max-width:1210px}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:22px}.pagehead h1{font-size:25px;line-height:1.2;margin:0 0 7px;letter-spacing:-.03em}.muted{color:var(--muted)}.btn{border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);padding:10px 14px;font-weight:650}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.btn.danger{color:var(--red)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.card,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:18px;min-width:0}.card .label{color:var(--muted);font-size:13px}.card .value{font-size:27px;font-weight:800;letter-spacing:-.03em;margin:8px 0 4px}.card .hint{font-size:12px;color:var(--muted)}.panel h2{font-size:17px;margin:0 0 15px}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.event{padding:13px 0;border-bottom:1px solid #f1f5f9;display:flex;gap:12px;align-items:center}.event:last-child{border-bottom:0}.datebox{width:48px;height:50px;flex-shrink:0;border:1px solid var(--line);border-radius:10px;display:grid;place-content:center;text-align:center}.datebox b{font-size:17px}.datebox small{font-size:10px;color:var(--muted)}.avatar{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:#dbeafe;color:#1d4ed8;font-weight:750;flex-shrink:0}.row{display:flex;align-items:center;gap:10px}.row .grow{flex:1;min-width:0}.row strong{display:block}.row small{color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.field{display:grid;gap:6px;min-width:0;flex:1}.field label{font-size:13px;font-weight:650;color:#334155}.field input,.field select{width:100%;min-height:44px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:white;color:var(--ink)}.search{max-width:360px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:530px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #f1f5f9;font-size:13px}th{color:var(--muted);font-weight:700;background:#fafcff}td .btn{padding:6px 9px;font-size:12px}.pill{font-size:11px;padding:5px 8px;border-radius:20px;background:#dcfce7;color:#166534;font-weight:750}.pill.pending{background:#fef3c7;color:#92400e}.notice{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:18px}.empty{text-align:center;padding:35px 10px;color:var(--muted)}.mobilebar{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:white;padding:12px 16px;border-radius:12px;z-index:20;box-shadow:0 10px 30px #0f172a30;max-width:90vw}.modalback{position:fixed;inset:0;background:#0f172a66;display:grid;place-items:center;padding:16px;z-index:15}.modal{background:white;width:min(480px,100%);border-radius:18px;padding:22px;max-height:90dvh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid .wide{grid-column:1/-1}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.hide{display:none!important}.login{min-height:100dvh;display:grid;place-items:center;padding:20px}.loginbox{width:min(410px,100%);background:white;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 12px 35px #0f172a0a}.loginbox h1{font-size:25px;margin:22px 0 6px}.loginbox .field{margin:15px 0}.loginbox .btn{width:100%;min-height:48px}.tiny{text-align:center;font-size:12px;color:var(--muted);margin-top:18px}.membernav{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.membernav .btn{white-space:nowrap}

</style></head><body><div id="app"></div><script>
const THEME_KEY='cm-preview-seguranca-theme-v2';let theme='light';try{theme=localStorage.getItem(THEME_KEY)==='dark'?'dark':'light'}catch{}document.body.dataset.theme=theme;const initialThemeMeta=document.querySelector('meta[name="theme-color"]');if(initialThemeMeta)initialThemeMeta.content=theme==='dark'?'#0b1220':'#2563eb';function toggleTheme(){theme=theme==='dark'?'light':'dark';try{localStorage.setItem(THEME_KEY,theme)}catch{}document.body.dataset.theme=theme;const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=theme==='dark'?'#0b1220':'#2563eb';render()}const KEY='cm-preview-seguranca-validacao-v2';const seed={members:[{id:1,name:'Ana Paula Ferreira',email:'ana@exemplo.com',phone:'(11) 99999-0001',ministry:'Louvor',role:'Membro',status:'Ativo'},{id:2,name:'Lucas Martins',email:'lucas@exemplo.com',phone:'(11) 99999-0002',ministry:'Jovens',role:'Líder',status:'Ativo'},{id:3,name:'Mariana Costa',email:'mariana@exemplo.com',phone:'(11) 99999-0003',ministry:'Ministério Infantil',role:'Membro',status:'Ativo'}],ministries:[{id:1,name:'Louvor',coordinator:'Ana Paula',description:'Música e adoração',status:'Ativo'},{id:2,name:'Jovens',coordinator:'Lucas Martins',description:'Encontros de jovens',status:'Ativo'},{id:3,name:'Ministério Infantil',coordinator:'Mariana Costa',description:'Atividades infantis',status:'Ativo'}],events:[{id:1,title:'Culto de celebração',date:'2026-10-18',time:'19:00',location:'Templo principal',status:'Confirmado'},{id:2,title:'Encontro de jovens',date:'2026-10-20',time:'19:30',location:'Salão social',status:'Planejado'},{id:3,title:'Reunião de voluntários',date:'2026-10-24',time:'09:00',location:'Sala 2',status:'Planejado'}],transactions:[{id:1,description:'Oferta do culto',category:'Ofertas',method:'PIX',type:'Entrada',amount:1250,date:'2026-10-12'},{id:2,description:'Conta de energia',category:'Despesas fixas',method:'Transferência',type:'Saída',amount:320,date:'2026-10-11'},{id:3,description:'Doação de alimentos',category:'Doações',method:'Dinheiro',type:'Entrada',amount:450,date:'2026-10-10'}],roles:[{id:1,name:'Administrador',description:'Acesso administrativo',status:'Ativo'},{id:2,name:'Tesouraria',description:'Acesso financeiro',status:'Ativo'},{id:3,name:'Líder de ministério',description:'Gestão de atividades',status:'Ativo'}],scales:[{id:1,title:'Equipe de louvor',ministry:'Louvor',date:'2026-10-18',time:'18:00',members:'Ana Paula, Lucas',status:'Confirmada'},{id:2,title:'Recepção',ministry:'Recepção',date:'2026-10-20',time:'19:00',members:'Mariana Costa',status:'Pendente'}],settings:{churchName:'Comunidade Esperança',email:'contato@exemplo.com',phone:'(11) 3333-0000',address:'São Paulo, SP'}};let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{data=JSON.parse(JSON.stringify(seed))}let user=null,section='dashboard',query='',toastTimer,previewLoginFailures=0,previewLockedUntil=0;const titles={dashboard:'Visão geral',members:'Gestão de membros',ministries:'Ministérios',events:'Eventos e calendário',finance:'Controle financeiro',roles:'Cargos e permissões',scales:'Gestão de escalas',settings:'Configurações',portal:'Área do membro'};const icons={dashboard:'▦',members:'♙',ministries:'♧',events:'▣',finance:'＄',roles:'♜',scales:'☷',settings:'⚙',portal:'♡'};function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}}function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function date(v){if(!v)return '—';let d=new Date(v+'T12:00:00');return d.toLocaleDateString('pt-BR')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notify(msg){let n=document.querySelector('.toast');if(!n){n=document.createElement('div');n.className='toast';document.body.append(n)}n.textContent=msg;n.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.add('hide'),2600)}function login(){document.getElementById('app').innerHTML=`<div class="login"><button class="btn theme-login" type="button" onclick="toggleTheme()" aria-label="${theme==='dark'?'Ativar modo claro':'Ativar modo noturno'}" title="${theme==='dark'?'Ativar modo claro':'Ativar modo noturno'}">${theme==='dark'?'☀️':'🌙'}</button><form class="loginbox" id="loginForm"><div class="brand"><div class="logo">C</div><div>ChurchManager<small>Gestão simples para sua igreja</small></div></div><h1>Bem-vindo de volta</h1><p class="muted">Entre na prévia interativa do sistema. Esta tela é demonstrativa e não autentica contra a API.</p><div class="field"><label for="email">Usuário</label><input id="email" name="username" type="text" value="Jonathan Otiniel" autocomplete="username" maxlength="160" required></div><div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" value="1234" autocomplete="current-password" maxlength="128" required></div><p id="loginFeedback" role="alert" aria-live="polite" class="tiny" style="color:var(--red);min-height:1.2em;margin:0 0 10px"></p><button class="btn primary" type="submit">Entrar →</button><p class="tiny">ACESSO DEMONSTRATIVO · DADOS FICTÍCIOS<br>Usuário: Jonathan Otiniel · Senha: 1234<br>5 tentativas inválidas bloqueiam o acesso por 60 segundos nesta prévia.</p></form></div>`;document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();const feedback=document.getElementById('loginFeedback');const submit=e.currentTarget.querySelector('button[type="submit"]');const now=Date.now();if(now<previewLockedUntil){feedback.textContent=`Acesso temporariamente bloqueado. Aguarde ${Math.ceil((previewLockedUntil-now)/1000)} s.`;return;}if(now>=previewLockedUntil&&previewLockedUntil){previewLockedUntil=0;previewLoginFailures=0;}const identifier=document.getElementById('email').value.trim().toLocaleLowerCase('pt-BR');const password=document.getElementById('password').value;if(identifier!=='jonathan otiniel'||password!=='1234'){previewLoginFailures++;if(previewLoginFailures>=5){previewLockedUntil=Date.now()+60000;previewLoginFailures=0;feedback.textContent='Muitas tentativas inválidas. Acesso bloqueado por 60 segundos nesta prévia.';}else{feedback.textContent='Usuário ou senha inválidos.';}return;}previewLoginFailures=0;previewLockedUntil=0;user={name:'Jonathan Otiniel',role:'Administrador'};section='dashboard';render();}}function render(){if(!user){login();return}const navKeys=user.role==='Membro'?['portal','events','scales','settings']:['dashboard','members','ministries','events','finance','roles','scales','settings'];document.getElementById('app').innerHTML=`<div class="shell"><header class="top"><div class="brand"><div class="logo">C</div><div>ChurchManager<small class="org">${esc(data.settings.churchName)}</small></div></div><div class="row"><div style="text-align:right"><strong>${esc(user.name)}</strong><small>${esc(user.role)}</small></div><button class="btn theme-toggle" type="button" onclick="toggleTheme()" aria-label="${theme==='dark'?'Ativar modo claro':'Ativar modo noturno'}" title="${theme==='dark'?'Ativar modo claro':'Ativar modo noturno'}">${theme==='dark'?'☀️':'🌙'}</button><button class="btn" onclick="logout()" aria-label="Sair">Sair</button></div></header><div class="layout"><aside class="side"><div class="navlabel">MENU PRINCIPAL</div>${navKeys.map(k=>`<button class="nav ${section===k?'active':''}" onclick="go('${k}')"><span>${icons[k]}</span>${titles[k]}</button>`).join('')}<div class="notice" style="margin:20px 4px 0">Prévia interativa<br><small>Os dados ficam neste navegador.</small></div></aside><main class="main"><div class="pagehead"><div><h1>${titles[section]||'Área do membro'}</h1><div class="muted">${section==='dashboard'?'Acompanhe os principais indicadores da sua igreja.':section==='portal'?'Seus eventos e informações em um só lugar.':'Consulte e organize as informações do sistema.'}</div></div>${['members','ministries','events','finance','roles','scales'].includes(section)&&user.role!=='Membro'?`<button class="btn primary" onclick="openForm('${section}')">＋ Adicionar</button>`:''}</div><div class="notice">Prévia local com dados fictícios. Validações de interface para demonstração; autenticação, permissões e persistência reais são responsabilidade da API e do banco do projeto. Não insira dados pessoais reais.</div>${content()}</main></div><nav class="mobilebar">${navKeys.slice(0,5).map(k=>`<button class="${section===k?'active':''}" onclick="go('${k}')"><span>${icons[k]}</span>${titles[k].split(' ')[0]}</button>`).join('')}<button onclick="toggleMore()"><span>•••</span>Mais</button></nav></div><div id="modal"></div>`;save()}function go(k){section=k;query='';render()}function logout(){user=null;login()}function toggleMore(){let keys=['dashboard','members','ministries','events','finance','roles','scales','settings'];let html=`<div class="modalback" onclick="if(event.target===this)this.remove()"><div class="modal"><div class="modalhead"><h2>Todos os módulos</h2><button class="btn" onclick="this.closest('.modalback').remove()">Fechar</button></div>${keys.map(k=>`<button class="nav" onclick="go('${k}')">${icons[k]} ${titles[k]}</button>`).join('')}</div></div>`;document.getElementById('modal').innerHTML=html}function content(){let active=data.members.filter(x=>x.status==='Ativo').length,inc=data.transactions.filter(x=>x.type==='Entrada').reduce((a,x)=>a+ +x.amount,0),out=data.transactions.filter(x=>x.type==='Saída').reduce((a,x)=>a+ +x.amount,0);if(section==='dashboard')return `<div class="cards">${[['Membros cadastrados',data.members.length,'Pessoas registradas'],['Ministérios ativos',data.ministries.length,'Áreas de atuação'],['Próximos eventos',data.events.length,'Eventos cadastrados'],['Saldo demonstrativo',money(inc-out),'Entradas menos saídas']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="hint">${x[2]}</div></div>`).join('')}</div><div class="split"><section class="panel"><h2>Próximos eventos</h2>${data.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4).map(e=>`<div class="event"><div class="datebox"><b>${e.date.slice(8,10)}</b><small>${date(e.date).split('/')[1]+'/'+date(e.date).split('/')[2]}</small></div><div class="grow"><strong>${esc(e.title)}</strong><small>${esc(e.time)} · ${esc(e.location)}</small></div><span class="pill ${e.status==='Planejado'?'pending':''}">${esc(e.status)}</span></div>`).join('')||'<div class="empty">Nenhum evento cadastrado.</div>'}</section><section class="panel"><h2>Resumo financeiro</h2><div class="event"><div class="avatar">↗</div><div class="grow"><small>Entradas</small><strong style="color:var(--green)">${money(inc)}</strong></div></div><div class="event"><div class="avatar" style="background:#fee2e2;color:#b91c1c">↘</div><div class="grow"><small>Saídas</small><strong style="color:var(--red)">${money(out)}</strong></div></div><div class="event"><div class="avatar">＝</div><div class="grow"><small>Saldo atual</small><strong>${money(inc-out)}</strong></div></div><button class="btn" style="width:100%;margin-top:10px" onclick="go('finance')">Ver movimentações</button></section></div>`;if(section==='portal')return `<div class="cards"><div class="card"><div class="label">Próximos eventos</div><div class="value">${data.events.length}</div></div><div class="card"><div class="label">Minhas escalas</div><div class="value">${data.scales.length}</div></div></div><div class="panel"><h2>Agenda da comunidade</h2>${data.events.map(e=>`<div class="event"><div class="datebox"><b>${e.date.slice(8,10)}</b><small>${date(e.date).slice(3)}</small></div><div class="grow"><strong>${esc(e.title)}</strong><small>${date(e.date)} · ${esc(e.time)} · ${esc(e.location)}</small></div></div>`).join('')}</div><div class="panel" style="margin-top:16px"><h2>Minhas escalas</h2>${data.scales.map(s=>`<div class="event"><div class="grow"><strong>${esc(s.title)}</strong><small>${date(s.date)} · ${esc(s.time)}</small></div><span class="pill ${s.status==='Pendente'?'pending':''}">${esc(s.status)}</span></div>`).join('')}</div>`;let conf={members:{label:'membros',cols:['Nome','E-mail','Ministério','Status'],keys:['name','email','ministry','status'],fields:[['name','Nome completo','text'],['email','E-mail','email'],['phone','Telefone','tel'],['ministry','Ministério','text'],['role','Cargo','text'],['status','Status','select:Ativo|Inativo']]},ministries:{label:'ministérios',cols:['Ministério','Coordenador','Descrição','Status'],keys:['name','coordinator','description','status'],fields:[['name','Nome','text'],['coordinator','Coordenador','text'],['description','Descrição','text'],['status','Status','select:Ativo|Inativo']]},events:{label:'eventos',cols:['Evento','Data','Horário','Local','Status'],keys:['title','date','time','location','status'],fields:[['title','Nome do evento','text'],['date','Data','date'],['time','Horário','time'],['location','Local','text'],['status','Status','select:Planejado|Confirmado|Cancelado']]},finance:{label:'movimentações',cols:['Descrição','Categoria','Tipo','Valor','Data'],keys:['description','category','type','amount','date'],fields:[['description','Descrição','text'],['category','Categoria','text'],['type','Tipo','select:Entrada|Saída'],['amount','Valor (R$)','number'],['date','Data','date']]},roles:{label:'cargos',cols:['Cargo','Descrição','Status'],keys:['name','description','status'],fields:[['name','Nome do cargo','text'],['description','Descrição','text'],['status','Status','select:Ativo|Inativo']]},scales:{label:'escalas',cols:['Equipe/escala','Ministério','Data','Horário','Status'],keys:['title','ministry','date','time','status'],fields:[['title','Nome da escala','text'],['ministry','Ministério','text'],['date','Data','date'],['time','Horário','time'],['members','Participantes','text'],['status','Status','select:Confirmada|Pendente|Cancelada']]}};if(section==='settings')return `<section class="panel"><h2>Dados da instituição</h2><form onsubmit="saveSettings(event)"><div class="formgrid">${[['churchName','Nome da igreja','text',160],['email','E-mail','email',254],['phone','Telefone','tel',40],['address','Endereço','text',300]].map(([k,l,t,m])=>`<div class="field"><label>${l} <span class="required-star">*</span></label><input type="${t}" maxlength="${m}" name="${k}" value="${esc(data.settings[k])}" required></div>`).join('')}</div><div class="formactions"><button class="btn primary">Salvar alterações</button></div></form></section><section class="panel" style="margin-top:16px"><h2>Dados desta prévia</h2><p class="muted">Os cadastros são guardados somente no armazenamento local deste navegador. Não insira informações pessoais reais.</p><button class="btn danger" onclick="resetData()">Restaurar dados de exemplo</button></section>`;let c=conf[section];if(!c)return '<div class="panel">Módulo em preparação.</div>';let listKey=section==='finance'?'transactions':section;let rows=data[listKey].filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(query.toLowerCase())));return `<section class="panel"><div class="toolbar"><div class="field search"><input placeholder="Buscar ${c.label}..." value="${esc(query)}" oninput="searchRows(this.value)"></div><div class="muted" style="align-self:center;font-size:13px">${rows.length} registro(s)</div></div><div class="tablewrap"><table><thead><tr>${c.cols.map(x=>`<th>${x}</th>`).join('')}<th>Ações</th></tr></thead><tbody>${rows.map(x=>`<tr>${c.keys.map(k=>`<td>${k==='amount'?money(x[k]):k==='date'?date(x[k]):k==='status'?`<span class="pill ${['Pendente','Planejado','Inativo','Cancelada'].includes(x[k])?'pending':''}">${esc(x[k])}</span>`:esc(x[k])}</td>`).join('')}<td><button class="btn" onclick="openForm('${section}',${x.id})">Editar</button> <button class="btn danger" onclick="removeItem('${section}',${x.id})">Excluir</button></td></tr>`).join('')}</tbody></table></div>${rows.length?'':'<div class="empty">Nenhum registro encontrado.</div>'}</section>`}function searchRows(v){query=v;let el=document.querySelector('.tablewrap');if(!el)return;let y=window.scrollY;render();window.scrollTo(0,y);let input=document.querySelector('.search input');if(input){input.focus();input.setSelectionRange(v.length,v.length)}}function openForm(sectionName,id){
 const ministryOptions=['Louvor','Recepção','Ministério Infantil','Comunicação','Assistência','Jovens'];
 const memberMinistryOptions=[...ministryOptions,'Todos'];
 const schemas={
  members:{label:'membro',fields:[
   {key:'name',label:'Nome completo',type:'text',required:true,min:2,max:160,wide:true,help:'Obrigatório · de 2 a 160 caracteres'},
   {key:'email',label:'E-mail',type:'email',max:254,help:'Opcional · informe um e-mail válido'},
   {key:'phone',label:'Telefone',type:'tel',max:40,help:'Opcional'},
   {key:'ministry',label:'Ministério',type:'select',required:true,options:memberMinistryOptions},
   {key:'role',label:'Cargo',type:'select',required:true,options:['Membro','Líder','Administrador','Tesouraria']},
   {key:'status',label:'Status',type:'select',required:true,options:['Ativo','Inativo']}
  ]},
  ministries:{label:'ministério',fields:[
   {key:'name',label:'Nome do ministério',type:'text',required:true,min:2,max:160,help:'Obrigatório · de 2 a 160 caracteres'},
   {key:'coordinator',label:'Coordenador',type:'text',max:160},
   {key:'description',label:'Descrição',type:'text',max:500,wide:true,help:'Opcional · até 500 caracteres'},
   {key:'status',label:'Status',type:'select',required:true,options:['Ativo','Inativo']}
  ]},
  events:{label:'evento',fields:[
   {key:'title',label:'Nome do evento',type:'text',required:true,min:2,max:180,wide:true,help:'Obrigatório'},
   {key:'date',label:'Data',type:'date',required:true},
   {key:'time',label:'Horário',type:'time',required:true},
   {key:'location',label:'Local',type:'text',max:180},
   {key:'ministry',label:'Ministério',type:'select',required:true,options:['Todos',...ministryOptions]},
   {key:'status',label:'Status',type:'select',required:true,options:['Planejado','Confirmado','Cancelado']}
  ]},
  finance:{label:'movimentação financeira',fields:[
   {key:'description',label:'Descrição',type:'text',required:true,min:2,max:180,wide:true,help:'Obrigatório · de 2 a 180 caracteres'},
   {key:'type',label:'Tipo',type:'select',required:true,options:['Entrada','Saída']},
   {key:'amount',label:'Valor (R$)',type:'number',required:true,min:'0.01',max:'9999999999.99',step:'0.01',help:'Valor positivo · máximo de 2 casas decimais'},
   {key:'category',label:'Categoria',type:'select',required:true,options:['Ofertas','Contribuições','Doações','Despesas fixas','Manutenção','Eventos','Outros']},
   {key:'date',label:'Data',type:'date',required:true},
   {key:'method',label:'Método',type:'select',required:true,options:['PIX','Transferência','Dinheiro','Cartão','Outro']}
  ]},
  roles:{label:'cargo',fields:[
   {key:'name',label:'Nome do cargo',type:'text',required:true,min:2,max:120,wide:true,help:'Obrigatório · de 2 a 120 caracteres'},
   {key:'description',label:'Descrição',type:'text',max:500,wide:true},
   {key:'status',label:'Status',type:'select',required:true,options:['Ativo','Inativo']}
  ]},
  scales:{label:'escala',fields:[
   {key:'title',label:'Nome da escala',type:'text',required:true,min:2,max:180,wide:true},
   {key:'ministry',label:'Ministério',type:'select',required:true,options:ministryOptions},
   {key:'date',label:'Data',type:'date',required:true},
   {key:'time',label:'Horário',type:'time',required:true},
   {key:'members',label:'Equipe / participantes',type:'text',max:8000,wide:true,help:'Separe os nomes por vírgula · até 500 participantes'},
   {key:'status',label:'Status',type:'select',required:true,options:['Pendente','Confirmada','Concluída']}
  ]}
 };
 const schema=schemas[sectionName];if(!schema)return;
 const listKey=sectionName==='finance'?'transactions':sectionName;
 const item=id?data[listKey].find(x=>x.id===id):{};
 if(id&&!item){notify('Não foi possível localizar este registro.');return;}
 const fields=schema.fields.map(f=>{
  const value=item[f.key]??(f.key==='date'?new Date().toISOString().slice(0,10):'');
  const required=f.required?'required':'';
  const max=f.max?`maxlength="${f.max}"`:'';
  const minLength=f.min?`minlength="${f.min}"`:'';
  const numericMin=f.min!==undefined&&f.type==='number'?`min="${f.min}"`:'';
  const maxNum=f.max&&f.type==='number'?`max="${f.max}"`:'';
  const step=f.step?`step="${f.step}"`:'';
  const label=`${esc(f.label)}${f.required?' <span class="required-star" aria-label="obrigatório">*</span>':''}`;
  const control=f.type==='select'
   ?`<select name="${f.key}" ${required}>${f.options.map(opt=>`<option value="${esc(opt)}" ${String(value)===opt?'selected':''}>${esc(opt)}</option>`).join('')}</select>`
   :`<input name="${f.key}" type="${f.type}" value="${esc(value)}" ${required} ${max} ${minLength} ${numericMin} ${maxNum} ${step} ${f.type==='email'?'autocomplete="email"':''} ${f.type==='number'?'inputmode="decimal"':''}>`;
  return `<div class="field ${f.wide?'wide':''}"><label for="field-${f.key}">${label}</label>${control.replace(`name="${f.key}"`,`id="field-${f.key}" name="${f.key}"`)}${f.help?`<small class="field-help">${esc(f.help)}</small>`:''}</div>`;
 }).join('');
 document.getElementById('modal').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><form class="modal" novalidate onsubmit="saveItem(event,'${sectionName}',${id||'null'})"><div class="modalhead"><h2>${id?'Editar':'Adicionar'} ${schema.label}</h2><button type="button" class="btn" onclick="closeModal()" aria-label="Fechar formulário">✕</button></div><p class="muted" style="font-size:12px;margin:-7px 0 14px">Campos marcados com <span class="required-star">*</span> são obrigatórios.</p><div class="formgrid">${fields}</div><div class="formactions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form></div>`;
}function closeModal(){document.getElementById('modal').innerHTML=''}function validatePreviewRecord(resource,record){
 const required=(key,label)=>{if(record[key]==null||String(record[key]).trim()==='')throw new Error(`Preencha o campo ${label}.`);};
 const length=(key,label,max,min=0)=>{const value=String(record[key]??'').trim();if(value.length<min)throw new Error(`${label} deve ter pelo menos ${min} caracteres.`);if(String(record[key]??'').length>max)throw new Error(`${label} deve ter no máximo ${max} caracteres.`);};
 const choices={members:{ministry:['Louvor','Recepção','Ministério Infantil','Comunicação','Assistência','Jovens','Todos'],role:['Membro','Líder','Administrador','Tesouraria'],status:['Ativo','Inativo']},ministries:{status:['Ativo','Inativo']},events:{ministry:['Todos','Louvor','Recepção','Ministério Infantil','Comunicação','Assistência','Jovens'],status:['Planejado','Confirmado','Cancelado']},transactions:{type:['Entrada','Saída'],category:['Ofertas','Contribuições','Doações','Despesas fixas','Manutenção','Eventos','Outros'],method:['PIX','Transferência','Dinheiro','Cartão','Outro']},roles:{status:['Ativo','Inativo']},scales:{ministry:['Louvor','Recepção','Ministério Infantil','Comunicação','Assistência','Jovens'],status:['Pendente','Confirmada','Concluída']}};
 const choice=(key,label)=>{const opts=choices[resource]?.[key];if(opts&&!opts.includes(record[key]))throw new Error(`Selecione uma opção válida para ${label}.`);};
 const dateCheck=(key,label)=>{required(key,label);const v=String(record[key]);if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){throw new Error(`Informe uma ${label.toLowerCase()} válida.`);}const d=new Date(`${v}T00:00:00Z`);if(Number.isNaN(d.getTime())||d.toISOString().slice(0,10)!==v)throw new Error(`Informe uma ${label.toLowerCase()} válida.`);};
 const timeCheck=()=>{required('time','Horário');if(!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(String(record.time)))throw new Error('Informe um horário válido.');};
 if(resource==='members'){required('name','Nome completo');length('name','Nome completo',160,2);if(String(record.email||'').length>254)throw new Error('E-mail deve ter no máximo 254 caracteres.');if(record.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(record.email).trim()))throw new Error('Informe um e-mail válido ou deixe o campo vazio.');if(String(record.phone||'').length>40)throw new Error('Telefone deve ter no máximo 40 caracteres.');choice('ministry','Ministério');choice('role','Cargo');choice('status','Status');}
 if(resource==='ministries'){required('name','Nome do ministério');length('name','Nome do ministério',160,2);length('description','Descrição',500);length('coordinator','Coordenador',160);choice('status','Status');}
 if(resource==='events'){required('title','Nome do evento');length('title','Nome do evento',180,2);dateCheck('date','Data');timeCheck();length('location','Local',180);choice('ministry','Ministério');choice('status','Status');}
 if(resource==='transactions'){required('description','Descrição');length('description','Descrição',180,2);required('amount','Valor');const n=Number(record.amount);if(!Number.isFinite(n)||n<=0||n>9999999999.99||Math.round(n*100)!==n*100)throw new Error('Informe um valor positivo, de até R$ 9.999.999.999,99 e com no máximo duas casas decimais.');dateCheck('date','Data');choice('type','Tipo de movimentação');choice('category','Categoria');choice('method','Método');}
 if(resource==='roles'){required('name','Nome do cargo');length('name','Nome do cargo',120,2);length('description','Descrição',500);choice('status','Status');}
 if(resource==='scales'){required('title','Nome da escala');length('title','Nome da escala',180,2);dateCheck('date','Data');timeCheck();length('members','Equipe',8000);choice('ministry','Ministério');choice('status','Status');if(String(record.members||'').split(',').filter(x=>x.trim()).length>500)throw new Error('A escala pode ter no máximo 500 integrantes.');}
}
function saveItem(e,s,id){
 e.preventDefault();
 const form=e.target;
 if(!form.reportValidity())return;
 const obj=Object.fromEntries(new FormData(form).entries());
 const listKey=s==='finance'?'transactions':s;
 if(s==='finance')obj.amount=Number(obj.amount);
 try{validatePreviewRecord(listKey,obj);}catch(error){notify(error.message);const firstRequired=[...form.elements].find(el=>el.name&&el.required&&!String(el.value||'').trim());if(firstRequired)firstRequired.focus();return;}
 if(id){const i=data[listKey].findIndex(x=>x.id===id);if(i<0){notify('Registro não encontrado.');return;}data[listKey][i]={...data[listKey][i],...obj};}
 else data[listKey].unshift({id:Date.now(),...obj});
 save();closeModal();render();notify('Registro salvo nesta prévia.');
}function removeItem(s,id){if(!confirm('Excluir este registro de demonstração?'))return;let listKey=s==='finance'?'transactions':s;data[listKey]=data[listKey].filter(x=>x.id!==id);save();render();notify('Registro excluído.')}function saveSettings(e){e.preventDefault();if(!e.target.reportValidity())return;const next=Object.fromEntries(new FormData(e.target).entries());if(String(next.churchName||'').trim().length<2){notify('Informe o nome da igreja com pelo menos 2 caracteres.');return;}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(next.email||'').trim())){notify('Informe um e-mail válido para a instituição.');return;}if(String(next.email).length>254||String(next.churchName).length>160||String(next.phone||'').length>40||String(next.address||'').length>300){notify('Confira o tamanho máximo dos campos.');return;}data.settings={...data.settings,...next};save();render();notify('Configurações salvas nesta prévia.')}function resetData(){if(!confirm('Restaurar os dados de exemplo?'))return;data=JSON.parse(JSON.stringify(seed));save();render();notify('Dados de exemplo restaurados.')}render();
</script></body></html>
