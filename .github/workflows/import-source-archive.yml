name: Import ChurchManager project files

on:
  push:
    branches: [main]
    paths:
      - ".churchmanager_upload/part-12.txt"

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Restore project source files
        shell: bash
        run: |
          set -euo pipefail
          test -f .churchmanager_upload/part-12.txt
          cat .churchmanager_upload/part-*.txt > /tmp/churchmanager.zip.b64
          base64 --decode /tmp/churchmanager.zip.b64 > /tmp/churchmanager.zip
          unzip -t /tmp/churchmanager.zip
          cp README.md /tmp/churchmanager-professional-README.md
          unzip -oq /tmp/churchmanager.zip -d .
          cp /tmp/churchmanager-professional-README.md README.md
          rm -rf .churchmanager_upload
          rm -f .github/workflows/import-source-archive.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add complete ChurchManager project source"
          git push
