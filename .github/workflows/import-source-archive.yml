name: Import ChurchManager source archive

on:
  push:
    branches: [main]
    paths:
      - ".churchmanager_upload/part-10.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Rebuild and extract project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .churchmanager_upload/part-10.txt
          cat .churchmanager_upload/part-*.txt > /tmp/churchmanager.zip.b64
          base64 --decode /tmp/churchmanager.zip.b64 > /tmp/churchmanager.zip
          unzip -t /tmp/churchmanager.zip
          unzip -oq /tmp/churchmanager.zip -d .
          rm -rf .churchmanager_upload
          rm -f .github/workflows/import-source-archive.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add ChurchManager application source"
          git push
