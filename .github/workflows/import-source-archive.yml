name: Import ChurchManager project files

on:
  push:
    branches: [main]
    paths:
      - "ChurchManager-GitHub-Ready.zip"

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract application source
        shell: bash
        run: |
          set -euo pipefail
          test -f ChurchManager-GitHub-Ready.zip
          unzip -t ChurchManager-GitHub-Ready.zip
          cp README.md /tmp/churchmanager-professional-README.md
          unzip -oq ChurchManager-GitHub-Ready.zip -d .
          cp /tmp/churchmanager-professional-README.md README.md
          rm -f ChurchManager-GitHub-Ready.zip
          rm -f .github/workflows/import-source-archive.yml
          rm -rf .churchmanager_upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add complete ChurchManager project source"
          git push
